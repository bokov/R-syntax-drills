name: Regenerate manifest release assets

on:
  push:
    branches:
      - agent/manifest-release-versioning

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event.head_commit.message != 'Regenerate manifest release assets'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/manifest-release-versioning

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Build published student assets
        run: Rscript scripts/09_build_student_assets.R 1

      - name: Commit regenerated assets
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add student-assets/question_manifest.csv student-assets/runtime_question_pool.Rmd
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Regenerate manifest release assets'
          git push
