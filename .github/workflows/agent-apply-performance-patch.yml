name: Agent performance patch

on:
  push:
    branches:
      - agent/assignment-service-performance

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/assignment-service-performance
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply performance patch
        run: python scripts/agent_apply_performance_patch.py
      - name: Run JavaScript helper tests
        run: node tests/js/test-fsrs.js
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script/Code.gs tests/js/test-fsrs.js
          git diff --cached --quiet && exit 0
          git commit -m "Optimize assignment service hot path"
          git push origin HEAD:agent/assignment-service-performance

# Temporary branch-local workflow; removed before the PR is finalized.
