name: Remove residual gradebook hash fields once

on:
  push:
    branches:
      - agent/manifest-release-versioning
    paths:
      - .github/workflows/remove-gradebook-hashes-once.yml

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/manifest-release-versioning

      - name: Remove gradebook hash fields
        shell: python
        run: |
          from pathlib import Path

          gradebook = Path("R/gradebook.R")
          text = gradebook.read_text()
          replacements = [
              ('  "points",\n  "question_hash",\n  "assigned_at_utc",', '  "points",\n  "assigned_at_utc",'),
              ('manifest_required <- c("item_label", "topic", "points", "question_hash")', 'manifest_required <- c("item_label", "topic", "points")'),
              ('    anyNA(assignments$topic) || any(!nzchar(assignments$topic)) ||\n    anyNA(assignments$question_hash) || any(!nzchar(assignments$question_hash)) ||\n    anyNA(assignments$points)', '    anyNA(assignments$topic) || any(!nzchar(assignments$topic)) ||\n    anyNA(assignments$points)'),
              ('    )) ||\n    any(assignments$question_hash != expected$question_hash)', '    ))'),
              ('    c("event", "item_label", "topic", "points", "question_hash"),', '    c("event", "item_label", "topic", "points"),'),
              ('    dplyr::select(event, item_label, topic, points, question_hash)', '    dplyr::select(event, item_label, topic, points)'),
              ('      points = suppressWarnings(as.numeric(.data$points)),\n      question_hash = dplyr::na_if(trimws(as.character(.data$question_hash)), ""),', '      points = suppressWarnings(as.numeric(.data$points)),'),
              ('  if (any(is.na(assignments$question_hash) | !nzchar(assignments$question_hash))) {\n    stop("Assignments contain a missing question_hash.")\n  }\n', ''),
              ('      points = .data$points,\n      question_hash = .data$question_hash,', '      points = .data$points,'),
              ('      assigned_at_utc, event, item_label, topic, question_hash, points,', '      assigned_at_utc, event, item_label, topic, points,')
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"Expected gradebook fragment not found: {old!r}")
              text = text.replace(old, new, 1)
          if "question_hash" in text:
              raise SystemExit("Residual question_hash remains in R/gradebook.R")
          gradebook.write_text(text)

          tests = Path("tests/testthat/test-gradebook.R")
          text = tests.read_text()
          text = text.replace('    points = c(1, 1, 1),\n    question_hash = c("h1", "h2", "h3"),', '    points = c(1, 1, 1),')
          text = text.replace('    points = matched$points,\n    question_hash = matched$question_hash,', '    points = matched$points,')
          if "question_hash" in text:
              raise SystemExit("Residual question_hash remains in test-gradebook.R")
          tests.write_text(text)

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add R/gradebook.R tests/testthat/test-gradebook.R
          git diff --cached --check
          git commit -m "Remove gradebook hash dependency"
          git push origin HEAD:agent/manifest-release-versioning
