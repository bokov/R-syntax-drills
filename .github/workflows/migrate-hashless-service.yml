name: One-time hashless service migration

on:
  push:
    branches:
      - agent/manifest-release-versioning
    paths:
      - .github/workflows/migrate-hashless-service.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/manifest-release-versioning

      - name: Remove legacy fingerprint semantics
        shell: python
        run: |
          from pathlib import Path

          code_path = Path("google-apps-script/Code.gs")
          code = code_path.read_text()
          code = code.replace(
              "  'points',\n  'question_hash',\n  'assigned_at_utc',",
              "  'points',\n  'legacy_unused_content',\n  'assigned_at_utc',"
          )
          code = code.replace(
              "  'starter_question',\n  'question_hash',\n  'bank_version'",
              "  'starter_question',\n  'legacy_unused_1',\n  'legacy_unused_2'"
          )
          code = code.replace(
              "const RUNTIME_SCHEMA_VERSION = 'bank-handshake-v1';",
              "const RUNTIME_SCHEMA_VERSION = 'item-label-reconciliation-v1';"
          )
          code = code.replace("requestUsesBankHandshake", "requestUsesBankReconciliation")
          code = code.replace("bankHandshakeForRequest", "bankReconciliationForRequest")
          code = code.replace("attachBankVersion", "attachBankReconciliation")
          code = code.replace("bankHandshake", "bankReconciliation")
          code = code.replace("      clean(canonical.question_hash, 100),\n", "      '',\n")
          code = code.replace("    question_hash: row[7],\n", "")
          code = code.replace("    assignment.question_hash,\n", "    '',\n")
          code = code.replace(
              "      starter_question: sheetBoolean(row[4]),\n      question_hash: String(row[5] || '')",
              "      starter_question: sheetBoolean(row[4])"
          )
          for forbidden in ("question_hash", "bank_version", "BankHandshake", "bankHandshake", "attachBankVersion"):
              if forbidden in code:
                  raise SystemExit(f"Residual legacy service token in Code.gs: {forbidden}")
          code_path.write_text(code)

          recon_path = Path("google-apps-script/BankReconciliation.gs")
          recon = recon_path.read_text()
          recon = recon.replace(
              "// Client/content reconciliation is based on question IDs only. The legacy\n// function names are retained because Code.gs calls them, but no hash or bank\n// version is computed, sent, or compared.\n",
              "// Client/content reconciliation is based on question IDs only.\n"
          )
          recon = recon.replace("requestUsesBankHandshake", "requestUsesBankReconciliation")
          recon = recon.replace("bankHandshakeForRequest", "bankReconciliationForRequest")
          recon = recon.replace("attachBankVersion", "attachBankReconciliation")
          for forbidden in ("question_hash", "bank_version", "BankHandshake", "bankHandshake", "attachBankVersion"):
              if forbidden in recon:
                  raise SystemExit(f"Residual legacy service token in BankReconciliation.gs: {forbidden}")
          recon_path.write_text(recon)

          storage_path = Path("R/assignment_storage.R")
          storage = storage_path.read_text()
          storage = storage.replace(
              "QUESTION_BANK_SYNC_COLUMNS <- QUESTION_BANK_COLUMNS",
              "QUESTION_BANK_SYNC_COLUMNS <- c(\n  QUESTION_BANK_COLUMNS,\n  \"legacy_unused_1\",\n  \"legacy_unused_2\"\n)"
          )
          storage = storage.replace(
              "  out\n}\n\nassignment_config <- function",
              "  out$legacy_unused_1 <- \"\"\n  out$legacy_unused_2 <- \"\"\n  out[, QUESTION_BANK_SYNC_COLUMNS, drop = FALSE]\n}\n\nassignment_config <- function"
          )
          for forbidden in ("question_hash", "bank_version"):
              if forbidden in storage:
                  raise SystemExit(f"Residual legacy service token in assignment_storage.R: {forbidden}")
          storage_path.write_text(storage)

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add google-apps-script/Code.gs google-apps-script/BankReconciliation.gs R/assignment_storage.R
          git diff --cached --check
          git commit -m "Remove fingerprint fields from service runtime"
          git push
