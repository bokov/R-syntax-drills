name: Regenerate checker fix assets

on:
  push:
    branches:
      - agent/fix-checker-closure

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-checker-closure

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install build dependencies
        shell: Rscript {0}
        run: |
          install.packages(c(
            "testthat",
            "httr2",
            "googlesheets4",
            "dplyr",
            "tidyr",
            "purrr",
            "stringr",
            "lubridate",
            "tibble",
            "readr"
          ))

      - name: Regenerate student assets
        run: Rscript scripts/09_build_student_assets.R

      - name: Commit generated assets
        run: |
          git add -- student-assets/runtime_question_pool.Rmd student-assets/question_manifest.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate runtime assets for checker closure"
          git push origin HEAD:agent/fix-checker-closure
