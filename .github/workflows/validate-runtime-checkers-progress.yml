name: Validate runtime checkers and progress

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R test dependencies
        shell: Rscript {0}
        run: |
          install.packages(c(
            "testthat",
            "httr2",
            "googlesheets4",
            "dplyr",
            "tidyr",
            "purrr",
            "stringr",
            "lubridate",
            "tibble",
            "readr"
          ))

      - name: Run R tests
        run: Rscript tests/testthat.R

      - name: Run JavaScript tests
        run: |
          node tests/js/test-fsrs.js
          node tests/js/test-performance.js
          node tests/js/test-concurrency.js
          node tests/js/test-bank-handshake.js
          node tests/js/test-progress.js

      - name: Verify generated student assets
        run: |
          Rscript scripts/09_build_student_assets.R
          git diff --exit-code -- student-assets/runtime_question_pool.Rmd student-assets/question_manifest.csv
