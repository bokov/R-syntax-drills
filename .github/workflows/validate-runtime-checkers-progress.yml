name: Validate runtime checkers and progress

on:
  push:
    branches:
      - agent/runtime-checkers-progress

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/runtime-checkers-progress

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R test dependencies
        shell: Rscript {0}
        run: |
          install.packages(c(
            "testthat",
            "httr2",
            "googlesheets4",
            "dplyr",
            "tidyr",
            "purrr",
            "stringr",
            "lubridate",
            "tibble",
            "readr"
          ))

      - name: Run R tests
        run: Rscript tests/testthat.R

      - name: Run JavaScript tests
        run: |
          node tests/js/test-fsrs.js
          node tests/js/test-performance.js
          node tests/js/test-concurrency.js
          node tests/js/test-bank-handshake.js
          node tests/js/test-progress.js

      - name: Regenerate student assets
        run: Rscript scripts/09_build_student_assets.R

      - name: Commit regenerated student assets
        run: |
          git add -- student-assets/runtime_question_pool.Rmd student-assets/question_manifest.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate student runtime assets [skip ci]"
          git push origin HEAD:agent/runtime-checkers-progress
