name: Validate runtime checkers and progress

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R test dependencies
        shell: Rscript {0}
        run: |
          install.packages(c(
            "testthat",
            "httr2",
            "googlesheets4",
            "dplyr",
            "tidyr",
            "purrr",
            "stringr",
            "lubridate",
            "tibble",
            "readr",
            "rmarkdown"
          ))

      - name: Reject non-ASCII R source
        shell: Rscript {0}
        run: |
          paths <- c(
            list.files("R", pattern = "\\.[Rr]$", full.names = TRUE),
            "app.R"
          )
          has_non_ascii <- vapply(paths, function(path) {
            bytes <- readBin(
              path,
              what = "raw",
              n = as.integer(file.info(path)$size)
            )
            any(as.integer(bytes) > 127L)
          }, logical(1))
          if (any(has_non_ascii)) {
            stop(
              "Non-ASCII bytes found in R source: ",
              paste(paths[has_non_ascii], collapse = ", ")
            )
          }

      - name: Run R tests
        run: Rscript tests/testthat.R

      - name: Run JavaScript tests
        run: |
          node tests/js/test-fsrs.js
          node tests/js/test-performance.js
          node tests/js/test-concurrency.js
          node tests/js/test-bank-reconciliation.js
          node tests/js/test-progress.js
