name: Scratch regenerate student assets

on:
  push:
    branches:
      - agent/scratch-learnr-checker-assets

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Regenerate student assets
        run: Rscript scripts/09_build_student_assets.R

      - name: Commit generated assets
        run: |
          git add -- student-assets/runtime_question_pool.Rmd student-assets/question_manifest.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Regenerate student runtime assets"
          git push
